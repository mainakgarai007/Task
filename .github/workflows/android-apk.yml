name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Build web assets for Android
        run: npm run build
        env:
          CAPACITOR_BUILD: "true"

      - name: Generate Android project
        run: npx cap add android

      - name: Declare Android runtime location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          permissions = [
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          ]
          missing = [p for p in permissions if f'android:name="{p}"' not in text]
          if missing:
              marker = "    <application"
              if marker not in text:
                  raise SystemExit("Could not find <application> in AndroidManifest.xml")
              declarations = "".join(f'    <uses-permission android:name="{p}" />\n' for p in missing)
              text = text.replace(marker, declarations + marker, 1)
              path.write_text(text)
          print("Location permissions declared:", ", ".join(permissions))
          PY

      - name: Generate native notification sound assets
        run: |
          python3 - <<'PY'
          import math, os, struct, wave
          out = "android/app/src/main/res/raw"
          os.makedirs(out, exist_ok=True)
          presets = {"tasks_soft":[523.25], "tasks_chime":[659.25,783.99,1046.5], "tasks_alert":[880,660,880], "tasks_beep":[1000]}
          rate = 22050
          for name, tones in presets.items():
              samples = []
              for frequency in tones:
                  count = int(rate * 0.16)
                  for i in range(count):
                      envelope = min(1.0, i / (rate * 0.01), (count-i) / (rate * 0.02))
                      value = int(32767 * 0.18 * max(0.0, envelope) * math.sin(2 * math.pi * frequency * i / rate))
                      samples.append(max(-32768, min(32767, value)))
                  samples.extend([0] * int(rate * 0.04))
              with wave.open(os.path.join(out, name + ".wav"), "wb") as audio:
                  audio.setnchannels(1); audio.setsampwidth(2); audio.setframerate(rate)
                  audio.writeframes(b"".join(struct.pack("<h", sample) for sample in samples))
          PY

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build installable debug APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasks-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
